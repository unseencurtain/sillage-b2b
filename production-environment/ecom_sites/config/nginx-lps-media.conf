# Static product images only — no PHP, no WordPress.
# Host bind-mount: ecom_sites/data/media → /usr/share/nginx/html
# Preferred public URLs: https://images.<domain>/<file> (Caddy site → this root).
# Fallback: shop /lps-media/* is stripped by the edge proxy (compose gateway or VPS Caddy).
#
# Do not leak software / version on 404s. Directory listing stays off. Only image
# bytes are served; `/` and unknown paths are a plain 404.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	server_tokens off;
	autoindex off;
	absolute_redirect off;
	port_in_redirect off;

	error_page 400 403 404 405 500 502 503 504 @plain_error;
	location @plain_error {
		internal;
		default_type text/plain;
		add_header Cache-Control "no-store" always;
		return 404 "Not Found\n";
	}

	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	location = / {
		access_log off;
		log_not_found off;
		return 404;
	}

	location ~* \.(jpe?g|png|webp|gif|avif)$ {
		limit_except GET HEAD {
			deny all;
		}
		expires 30d;
		add_header Cache-Control "public, max-age=2592000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location / {
		access_log off;
		log_not_found off;
		return 404;
	}
}
